version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bulletin_board
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - app-network

  web:
    build: .
    command: gunicorn board_project.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/bulletin_board
      DEBUG: 'False'
    depends_on:
      - db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"  # Теперь заходите на http://localhost:8000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:  # Общий том для статики

networks:
  app-network:
    driver: bridge